<style>
  /* Page-level layout only: keep the footer out of printed pages. */
  @media print { .app-footer { display: none; } }
</style>
<footer class="app-footer container" style="padding-top: 0; padding-bottom: var(--space-24);">
  <p class="type-body-sm" style="color: var(--text-tertiary); margin: 0;">
    {{ brand }} coach onboarding
    {% if support_email %} · Need a hand? <a class="cm-link" href="mailto:{{ support_email }}">{{ support_email }}</a>{% endif %}
  </p>
</footer>
<script>
function cmMarkWatched(documentId, csrfToken, anchorId) {
  fetch("/document/" + documentId + "/watched", {
    method: "POST",
    headers: {"Content-Type": "application/x-www-form-urlencoded"},
    body: "_csrf=" + encodeURIComponent(csrfToken)
  }).then(function () {
    // Reload so the server decides whether the step is really unlocked (an
    // item can have more than one video), but come back to the step itself.
    // Reloading to the top of a long page leaves the button that just
    // appeared far offscreen, which reads as nothing having happened.
    if (anchorId) location.hash = anchorId;
    location.reload();
  }).catch(function () {});
}

function cmFormatSeconds(total) {
  total = Math.max(0, Math.ceil(total));
  var m = Math.floor(total / 60), s = total % 60;
  return m + ":" + (s < 10 ? "0" : "") + s;
}

// A video unlocks its step once this much of it has actually been played.
// Not the whole thing: the last stretch is usually sign-off, and holding the
// button back to the final second just makes people wait.
var CM_WATCH_FRACTION = 0.8;

// The countdown ignores playback position and only ticks while the video is
// unpaused, so scrubbing to the end can't shortcut it — a coach has to sit
// through the material, not skip to it.
document.querySelectorAll("video[data-cm-video-timer]").forEach(function (video) {
  var box = video.closest(".video-box");
  var bar = box.querySelector(".bar-fill");
  var label = box.querySelector(".video-timer-label");
  var documentId = video.dataset.documentId;
  var csrfToken = video.dataset.csrf;
  var remaining = null;
  var required = null;   // seconds of playback needed, not the full duration
  var tickHandle = null;
  var done = false;

  function render() {
    bar.style.width = (100 * (required - remaining) / required) + "%";
    label.textContent = remaining > 0
      ? "⏳ " + cmFormatSeconds(remaining) + " left before you can mark this done"
      : "✓ You can mark this done now.";
  }

  var step = video.closest('[id^="item-"]');

  function finish() {
    if (done) return;
    done = true;
    clearInterval(tickHandle);
    cmMarkWatched(documentId, csrfToken, step ? step.id : null);
  }

  function captureDuration() {
    if (required !== null || !isFinite(video.duration) || !video.duration) return;
    required = video.duration * CM_WATCH_FRACTION;
    remaining = required;
    render();
  }

  video.addEventListener("loadedmetadata", captureDuration);
  if (video.readyState >= 1) captureDuration();

  video.addEventListener("play", function () {
    if (done || tickHandle) return;
    captureDuration();
    if (required === null) return;
    tickHandle = setInterval(function () {
      remaining -= 1;
      if (remaining <= 0) {
        remaining = 0;
        render();
        finish();
        return;
      }
      render();
    }, 1000);
  });

  video.addEventListener("pause", function () {
    clearInterval(tickHandle);
    tickHandle = null;
  });
});
</script>
</body>
</html>
