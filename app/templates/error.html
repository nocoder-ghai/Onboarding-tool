{% set page_title = headline %}
{% include "partials/head.html" %}
<div class="container">
  <div class="empty-state empty-state-fullpage" role="status">
    <div class="empty-state-icon" style="width: auto; height: auto; background: none; font-size: var(--type-heading-md-size);">
      {% if status == 404 %}🧭{% elif status == 403 %}🔒{% else %}🛠️{% endif %}
    </div>
    <h1 class="empty-state-title">{{ headline }}</h1>
    <p class="empty-state-description">{{ message }}</p>
    <div class="empty-state-actions">
      <a class="btn btn-primary" href="/">Take me home</a>
    </div>
  </div>
</div>
{% include "partials/foot.html" %}
