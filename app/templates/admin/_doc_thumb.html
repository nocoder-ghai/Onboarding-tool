<div class="card card-compact card-horizontal" style="margin-top: var(--space-8);">
  {% if doc.current and doc.current.mime_type.startswith("image/") %}
    <a href="/admin/documents/{{ doc.id }}" class="card-thumb">
      <img src="/file/document/{{ doc.current.id }}" alt=""></a>
  {% elif doc.current and doc.kind == "video" %}
    <a href="/admin/documents/{{ doc.id }}" class="card-thumb">
      <img src="/file/document/{{ doc.current.id }}/thumbnail" alt=""
           onerror="this.parentElement.style.display='none'"></a>
  {% else %}
    <span class="card-thumb" style="display: flex; align-items: center; justify-content: center; font-size: var(--type-heading-md-size);">📄</span>
  {% endif %}
  <div class="card-body">
    <a class="cm-link" href="/admin/documents/{{ doc.id }}">{{ doc.title }}</a>
    {% if doc.current %}<span class="type-body-sm" style="color: var(--text-tertiary);">v{{ doc.current.version_no }}</span>
    {% else %}<span class="type-body-sm" style="color: var(--text-error);">no file uploaded</span>{% endif %}
  </div>
</div>
