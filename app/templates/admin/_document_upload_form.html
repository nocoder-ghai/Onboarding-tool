<details class="card card-expandable">
  <summary>
    <div>
      <div class="card-title">Add a document</div>
    </div>
    <span class="cm-icon card-expand-toggle" aria-hidden="true">
      <svg class="icon-plus" data-icon="add" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M12.9004 4V11.0996H20V12.9004H12.9004V20H11.0996V12.9004H4V11.0996H11.0996V4H12.9004Z" fill="currentColor"/>
</svg>
      <svg class="icon-minus" data-icon="minus" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M19.5 11.0996V12.9004L4.5 12.9004V11.0996L19.5 11.0996Z" fill="currentColor"/>
</svg>
    </span>
  </summary>
  <div class="card-expand-body">
    <form method="post" action="/admin/documents/new" enctype="multipart/form-data" class="form-stack">
      <input type="hidden" name="_csrf" value="{{ csrf }}">
      <input type="hidden" name="target_type" value="{{ doc_target_type }}">
      <input type="hidden" name="target_id" value="{{ doc_target_id }}">
      <input type="hidden" name="back" value="{{ doc_back }}">
      <div class="grid">
        <div class="col-8 col-sm-12">
          <div class="cm-field">
            <div class="cm-field-wrap">
              <input name="title" type="text" placeholder=" " required>
              <label class="cm-field-label">Title</label>
              <fieldset class="cm-field-notch" aria-hidden="true"><legend><span>Title</span></legend></fieldset>
            </div>
          </div>
        </div>
        <div class="col-4 col-sm-12">
          <div class="cm-field">
            <div class="cm-field-wrap">
              <select name="kind">
                <option value="video">Training video (or a photo, if there's no video yet)</option>
                <option value="policy">Policy (read &amp; acknowledge)</option>
                <option value="guide">Guide</option>
                <option value="sample">Sample for tutors</option>
                <option value="deck">Slide deck</option>
              </select>
              <span class="cm-field-label">Kind</span>
              <fieldset class="cm-field-notch" aria-hidden="true"><legend><span>Kind</span></legend></fieldset>
            </div>
          </div>
        </div>
      </div>

      <div class="grid">
        <div class="col-4 col-sm-12">
          <label class="type-label-sm" style="display: block; color: var(--text-secondary); margin-bottom: var(--space-4);">File</label>
          <input name="file" type="file">
        </div>
        <div class="col-4 col-sm-12">
          <div class="cm-field">
            <div class="cm-field-wrap">
              <input name="effective_from" type="date" placeholder=" ">
              <label class="cm-field-label">Effective from</label>
              <fieldset class="cm-field-notch" aria-hidden="true"><legend><span>Effective from</span></legend></fieldset>
            </div>
            <div class="cm-field-helper">Blank = live immediately.</div>
          </div>
        </div>
        <div class="col-4 col-sm-12">
          <div class="cm-field">
            <div class="cm-field-wrap">
              <input name="notes" type="text" placeholder=" ">
              <label class="cm-field-label">Version note</label>
              <fieldset class="cm-field-notch" aria-hidden="true"><legend><span>Version note</span></legend></fieldset>
            </div>
          </div>
        </div>
      </div>

      <label class="cm-checkbox">
        <input type="checkbox" name="is_active" value="1" checked>
        <span class="cm-checkbox-box">
          <svg data-icon="submit-thick" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M21.4162 6.53906L10.3078 19.5391L7.49141 18.5C7.49141 15.8794 5.60364 13.5833 2.90547 12.8975L3.69453 9.7959C6.50181 10.5095 8.83259 12.4511 9.96016 15.0195L18.9836 4.46094L21.4162 6.53906Z" fill="currentColor"/></svg>
        </span>
        <span class="cm-checkbox-label">Visible to tutors</span>
      </label>

      <div>
        <button class="btn btn-sm btn-primary" type="submit">Add document to “{{ doc_target_label }}”</button>
      </div>
    </form>
  </div>
</details>
